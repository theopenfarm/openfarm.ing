<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The dark-scheme mark as a standalone file.

    Safari does not evaluate CSS inside an SVG favicon, so the media query in
    favicon.svg has no effect there. The <link media> attributes in the layout
    pick this file instead, which is a mechanism every browser honours.
  -->
  <rect width="32" height="32" rx="7" fill="#e9eee4"/>
  <path d="M6 24.5 L24.5 6" stroke="#0c0f0b" stroke-width="1.6" stroke-opacity="0.32" stroke-linecap="round"/>
  <circle cx="11" cy="12" r="3.4" fill="#e2571e"/>
  <circle cx="21" cy="20.5" r="2.3" fill="#e2571e"/>
</svg>
